<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f5f5f4;font-family:Arial,Helvetica,sans-serif;color:#1c1917;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:24px;">
          <p style="margin:0 0 16px;">Hola {{ first_names }},</p>
          <h1 style="margin:0 0 16px;font-size:20px;">{{ title }}</h1>
          <p style="margin:0 0 16px;line-height:1.5;">{{ message|linebreaksbr }}</p>
          <p style="margin:0 0 16px;line-height:1.5;">{{ portal_line }}</p>
          <p style="margin:0;font-size:12px;color:#78716c;">Este es un mensaje automático; no lo respondas.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
