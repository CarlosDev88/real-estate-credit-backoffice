name: Backend CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mvp_credit
          POSTGRES_USER: mvp_credit_user
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mvp_credit_user -d mvp_credit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      AUTH_JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: mvp_credit
      DATABASE_USER: mvp_credit_user
      DATABASE_PASSWORD: ci_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=95

      # Si la API cambió, el PR debe traer el contrato regenerado (lo consume el frontend).
      - name: OpenAPI contract is up to date
        run: |
          python manage.py spectacular --settings config.settings.test --format openapi-json --file ../contracts/openapi.json --validate --fail-on-warn
          git diff --exit-code ../contracts/openapi.json
