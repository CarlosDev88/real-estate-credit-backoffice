name: Backend CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Solo lo necesario: leer el repo y publicar el comentario del reporte en el PR.
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: backend
        # Explícito para que corra con `-eo pipefail`: sin eso, `herramienta | tee` no falla.
        shell: bash

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mvp_credit
          POSTGRES_USER: mvp_credit_user
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mvp_credit_user -d mvp_credit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      AUTH_JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: mvp_credit
      DATABASE_USER: mvp_credit_user
      DATABASE_PASSWORD: ci_password
      # Salidas de las verificaciones para el reporte (relativa a backend/; ignorada por git).
      CI_REPORT_DIR: .ci-report
      CI_COVERAGE_MIN: "95"

    # Cada verificación lleva continue-on-error para que corran todas y el reporte muestre
    # todos los problemas; el paso "CI gate", al final, es el que hace fallar el job.
    steps:
      - name: Record start time
        working-directory: ${{ github.workspace }}
        run: echo "CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        id: install
        run: |
          mkdir -p "$CI_REPORT_DIR"
          pip install -r requirements.txt

      - name: Ruff (lint)
        id: ruff_lint
        continue-on-error: true
        run: |
          ruff check . --output-format=json > "$CI_REPORT_DIR/ruff.json" || true
          ruff check . --output-format=github

      - name: Ruff (format)
        id: ruff_format
        continue-on-error: true
        run: |
          ruff format --check . --output-format=json > "$CI_REPORT_DIR/ruff-format.json" || true
          ruff format --check . --output-format=concise

      - name: Mypy
        id: mypy
        continue-on-error: true
        run: |
          echo "::add-matcher::$GITHUB_WORKSPACE/.github/matchers/mypy.json"
          status=0
          mypy . --show-absolute-path 2>&1 | tee "$CI_REPORT_DIR/mypy.txt" || status=$?
          echo "::remove-matcher owner=mypy::"
          exit "$status"

      - name: Migrations are up to date
        id: migrations
        continue-on-error: true
        run: python manage.py makemigrations --check --dry-run 2>&1 | tee "$CI_REPORT_DIR/migrations.txt"

      - name: Tests
        id: tests
        continue-on-error: true
        run: >-
          pytest --cov=apps --cov=scripts --cov-report=term-missing
          --cov-report="xml:$CI_REPORT_DIR/coverage.xml" --junit-xml="$CI_REPORT_DIR/pytest.xml"

      # Corre aunque fallen los tests, siempre que haya datos de cobertura.
      - name: Coverage
        id: coverage
        if: hashFiles('backend/.coverage') != ''
        continue-on-error: true
        run: python -m coverage report --format=total --precision=2 --fail-under="$CI_COVERAGE_MIN"

      # Si la API cambió, el PR debe traer el contrato regenerado (lo consume el frontend).
      - name: OpenAPI contract is up to date
        id: openapi
        continue-on-error: true
        run: |
          cp ../contracts/openapi.json "$CI_REPORT_DIR/openapi.committed.json"
          python manage.py spectacular --settings config.settings.test --format openapi-json --file ../contracts/openapi.json --validate --fail-on-warn 2>&1 | tee "$CI_REPORT_DIR/spectacular.txt"
          cp ../contracts/openapi.json "$CI_REPORT_DIR/openapi.generated.json"
          git diff --exit-code -- ../contracts/openapi.json

      - name: Build CI report
        if: always()
        continue-on-error: true
        env:
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUTCOME_INSTALL: ${{ steps.install.outcome }}
          OUTCOME_RUFF_LINT: ${{ steps.ruff_lint.outcome }}
          OUTCOME_RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          OUTCOME_MYPY: ${{ steps.mypy.outcome }}
          OUTCOME_MIGRATIONS: ${{ steps.migrations.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_COVERAGE: ${{ steps.coverage.outcome }}
          OUTCOME_OPENAPI: ${{ steps.openapi.outcome }}
        run: python3 scripts/ci_report.py

      - name: Upload CI report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-backend
          path: backend/.ci-report/
          # .ci-report es una carpeta oculta: sin esto, upload-artifact no sube nada.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      # Un solo comentario por PR, identificado por el marcador: se edita si ya existe.
      - name: Comment CI report on the PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ci-report:backend -->';
            const path = 'backend/.ci-report/report.md';
            if (!fs.existsSync(path)) {
              core.warning('No hay reporte para publicar.');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Check obligatorio: falla si alguna verificación falló o si no se pudo instalar.
      # Las advertencias de pytest nunca lo hacen fallar.
      - name: CI gate
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          OUTCOMES: >-
            install=${{ steps.install.outcome }}
            ruff_lint=${{ steps.ruff_lint.outcome }}
            ruff_format=${{ steps.ruff_format.outcome }}
            mypy=${{ steps.mypy.outcome }}
            migrations=${{ steps.migrations.outcome }}
            tests=${{ steps.tests.outcome }}
            coverage=${{ steps.coverage.outcome }}
            openapi=${{ steps.openapi.outcome }}
        run: |
          failed=0
          for pair in $OUTCOMES; do
            name="${pair%%=*}"
            outcome="${pair#*=}"
            if [ "$outcome" = failure ] || { [ "$name" = install ] && [ "$outcome" != success ]; }; then
              echo "::error title=CI gate::$name: ${outcome:-no corrió}"
              failed=1
            fi
          done
          exit "$failed"
