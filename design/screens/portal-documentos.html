/* app shell compartido: barra lateral, barra superior y menú móvil */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--um-bg-sidebar); color: var(--um-text-on-sidebar); display: flex; flex-direction: column; padding: var(--um-space-4) var(--um-space-3); position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 30; }
.side .logo { color: #fff; font-size: var(--um-text-lg); padding: var(--um-space-1) var(--um-space-2) var(--um-space-6); }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side a { color: inherit; display: flex; align-items: center; gap: var(--um-space-3); padding: 8px var(--um-space-3); border-radius: var(--um-radius-md); font-size: var(--um-text-sm); text-decoration: none; }
.side a svg { width: 16px; height: 16px; opacity: 0.85; flex: none; }

.side a.active { background: rgba(255,255,255,0.14); color: #fff; font-weight: var(--um-weight-medium); }
.side a .count { margin-left: auto; font-size: 11px; background: rgba(255,255,255,0.14); border-radius: var(--um-radius-full); padding: 1px 7px; }

.side .me { margin-top: auto; display: flex; align-items: center; gap: var(--um-space-3); padding: var(--um-space-3) var(--um-space-2) 0; border-top: 1px solid rgba(255,255,255,0.1); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: var(--um-text-xs); font-weight: var(--um-weight-semibold); flex: none; background: var(--um-bg-muted); color: var(--um-text-secondary); }
.side .avatar { background: var(--um-color-teal-600); color: #fff; }
.side .me b { display: block; color: #fff; font-size: var(--um-text-sm); font-weight: var(--um-weight-medium); }
.side .me span { font-size: var(--um-text-xs); opacity: 0.7; }
.side .close-menu { display: none; }
.topbar { height: 56px; display: flex; align-items: center; gap: var(--um-space-2); padding: 0 var(--um-space-6); background: var(--um-bg-surface); border-bottom: 1px solid var(--um-border-default); position: sticky; top: 0; z-index: 20; }
.crumbs { font-size: var(--um-text-sm); color: var(--um-text-tertiary); display: flex; gap: var(--um-space-2); align-items: center; min-width: 0; }
.crumbs b { color: var(--um-text-primary); font-weight: var(--um-weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .global-search { width: 300px; }

/* ---------- visor de documentos (compartido) ---------- */
.viewer { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; background: #0B0F14; color: #E6EAEE; }
.viewer.open { display: flex; }
.viewer-bar { display: flex; align-items: center; gap: var(--um-space-2); padding: var(--um-space-2) var(--um-space-3); background: rgba(0, 0, 0, 0.35); border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-wrap: wrap; }
.viewer-bar .btn { color: #E6EAEE; }
.viewer-bar .btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
.viewer-bar .btn[disabled] { opacity: 0.4; background: none; cursor: default; }
.viewer-title { min-width: 0; }
.viewer-title b { display: block; font-size: var(--um-text-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
.viewer-title span { font-size: var(--um-text-xs); opacity: 0.7; }
.viewer-group { display: flex; align-items: center; gap: 2px; padding: 0 var(--um-space-1); border-left: 1px solid rgba(255, 255, 255, 0.12); }
.viewer-group output { min-width: 56px; text-align: center; font-size: var(--um-text-sm); font-variant-numeric: tabular-nums; }
.viewer-stage { flex: 1; overflow: auto; display: grid; justify-items: center; align-content: start; gap: var(--um-space-6); padding: var(--um-space-8) var(--um-space-4); }
.vpage { background: #fff; color: #222; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); border-radius: 2px; aspect-ratio: 8.5 / 11; padding: 7% 8%; display: grid; align-content: start; gap: 1.6%; transition: transform 0.2s; transform-origin: center top; }
.vpage .vh { height: 2.4%; width: 55%; background: #C9D2DC; border-radius: 3px; margin-bottom: 3%; }
.vpage .vrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6%; }
.vpage i { display: block; height: 1.2%; min-height: 6px; border-radius: 3px; background: #E3E8EE; }
.vpage .vbox { height: 18%; border: 1px solid #E3E8EE; border-radius: 4px; margin: 3% 0; }
.vpage .vfoot { margin-top: 8%; display: flex; justify-content: space-between; font-size: 10px; color: #8B98A6; }
.vphoto { aspect-ratio: 4 / 3; border-radius: 4px; background: linear-gradient(135deg, #5b6470, #39404a); display: grid; place-items: center; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); transition: transform 0.2s; overflow: hidden; }
.vphoto .vpage { width: 54%; transform: rotate(-4deg); filter: blur(0.6px) brightness(0.95); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4); }
.viewer-real { width: 100%; max-width: 1100px; height: 100%; min-height: 70vh; border: 0; background: #fff; border-radius: 2px; }
.viewer-real-img { max-width: 100%; height: auto; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); transition: transform 0.2s; transform-origin: center top; }
.viewer-note { font-size: var(--um-text-xs); opacity: 0.7; text-align: center; padding-bottom: var(--um-space-2); }
@media (max-width: 720px) {
  .viewer-title b { max-width: 60vw; }

    { id: 10, g: "daniel", name: "Documento de identidad", st: "UPLOADED", file: { name: "cedula-daniel.jpg", size: "860 KB", kind: "image", pages: 1, when: "hace 5 h" }, v: 1 },
    { id: 11, g: "daniel", name: "Soporte de actividad e ingresos", st: "APPROVED", file: { name: "contrato-servicios.pdf", size: "2,3 MB", kind: "pdf", pages: 2, when: "11 nov" }, v: 1 },
    { id: 12, g: "daniel", name: "Extracto bancario 1 de 3", st: "PENDING", v: 0, period: "Últimos 3 meses" },
    { id: 13, g: "daniel", name: "Extracto bancario 2 de 3", st: "APPROVED", file: { name: "extracto-dm-sep.pdf", size: "760 KB", kind: "pdf", pages: 2, when: "11 nov" }, v: 1 },
    { id: 14, g: "daniel", name: "Extracto bancario 3 de 3", st: "APPROVED", file: { name: "extracto-dm-oct.pdf", size: "810 KB", kind: "pdf", pages: 2, when: "11 nov" }, v: 1 },
    { id: 15, g: "app", name: "Promesa de compraventa", st: "APPROVED", file: { name: "promesa-apto-1204.pdf", size: "3,4 MB", kind: "pdf", pages: 6, when: "10 nov" }, v: 1 },
    { id: 16, g: "app", name: "Certificado de tradición y libertad", st: "WAIVED", v: 0, waived: "No aplica: el inmueble es sobre planos." }
  ];
  var STATUS = {
    PENDING: { label: "Te falta", tone: "warning", icon: '<path d="M9 3h2v6h6v2h-6v6H9v-6H3V9h6V3Z"/>' },
    REJECTED: { label: "Corrígelo", tone: "danger", icon: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-1 4h2v6H9V5Zm0 8h2v2H9v-2Z"/>' },
    UPLOADED: { label: "En revisión", tone: "info", icon: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm1 4v5.4l3.3 2-1 1.7L9 11.5V5h2Z"/>' },
    APPROVED: { label: "Aprobado", tone: "success", icon: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-1.2 13L4.5 9.7l1.4-1.4 2.9 2.9 5.3-5.3 1.4 1.4-6.7 6.7Z"/>' },
    WAIVED: { label: "No aplica", tone: "accent", icon: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM5 9h10v2H5V9Z"/>' }
  };
  var bucket = function (d) { return d.st === "PENDING" || d.st === "REJECTED" ? "todo" : d.st === "UPLOADED" ? "review" : "done"; };
  var state = { filter: "todo", sel: 4, uploading: null };
  var listEl = document.getElementById("list"), detailEl = document.getElementById("detail");
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var byId = function (id) { return docs.filter(function (d) { return d.id === id; })[0]; };
  var isMobile = function () { return window.matchMedia("(max-width: 900px)").matches; };
  var icon = function (p, cls) { return '<svg class="' + (cls || "") + '" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' + p + "</svg>"; };

  function counts() {
    var c = { all: docs.length, todo: 0, review: 0, done: 0 };
    docs.forEach(function (d) { c[bucket(d)]++; });
    document.querySelectorAll("[data-c]").forEach(function (s) { s.textContent = c[s.dataset.c]; });
    document.getElementById("readyCount").textContent = c.done + " de " + c.all;
    document.getElementById("readyBar").style.width = (c.done / c.all * 100) + "%";
    document.getElementById("navCount").textContent = c.todo; document.getElementById("tabCount").textContent = c.todo;
    document.getElementById("navCount").hidden = document.getElementById("tabCount").hidden = c.todo === 0;
    document.getElementById("summary").textContent = c.todo ? "Te faltan " + c.todo + (c.todo === 1 ? " documento" : " documentos") + ". Tu asesora revisa los demás." : "Subiste todo. Tu asesora está revisando tus documentos.";
  }

  function renderList() {
    var html = "";
    groups.forEach(function (g) {
      var items = docs.filter(function (d) { return d.g === g.id && (state.filter === "all" || bucket(d) === state.filter); });
      if (!items.length) return;
      html += '<div class="grp">' + esc(g.label) + '</div><ul class="items">';
      items.forEach(function (d) {
        var s = STATUS[d.st];
        var sub = d.st === "PENDING" ? (d.period || "Pendiente") : d.st === "WAIVED" ? "No necesitas subirlo" : d.file.name;
        html += '<li><button class="item" type="button" data-id="' + d.id + '" aria-current="' + (d.id === state.sel) + '">' +
          '<span class="st tone-' + s.tone + '">' + icon(s.icon) + "</span>" +
          "<span><b>" + esc(d.name) + "</b><small>" + s.label + " · " + esc(sub) + "</small></span>" +
          icon('<path d="m7.4 4 6 6-6 6L6 14.6l4.6-4.6L6 5.4 7.4 4Z"/>', "chev") + "</button></li>";
      });
      html += "</ul>";
    });
    listEl.innerHTML = html || '<p class="tertiary" style="padding:24px;text-align:center">No hay documentos en este grupo.</p>';
  }

  function fileCard(d, actions) {
    var f = d.file;
    var thumb = f.url && f.kind === "image" ? '<img alt="" src="' + f.url + '">' : '<span class="mini-page"><i></i><i></i><i></i><i style="width:70%"></i><i></i></span>';
    return '<div class="file"><button class="thumb' + (f.kind === "image" && !f.url ? " photo" : "") + '" type="button" data-open aria-label="Ver ' + esc(f.name) + '">' + thumb + "</button>" +
      '<div class="meta"><b>' + esc(f.name) + "</b><small>" + esc(f.size) + " · subido " + esc(f.when) + (d.v > 1 ? " · versión " + d.v : "") + "</small>" +
      (d.st !== "REJECTED" ? '<span class="scan">' + icon('<path d="M10 1 3 4v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V4l-7-3Zm-1.2 12L5.5 9.7l1.4-1.4 1.9 1.9 4.3-4.3 1.4 1.4-5.7 5.7Z"/>') + "Archivo revisado: es seguro</span>" : "") +
      '<div class="row">' + actions + "</div></div></div>";
  }

  function dropzone(d, replacing) {
    return (replacing ? "" : "") +
      '<div class="drop" id="drop" tabindex="0" role="button" aria-label="Subir archivo: arrastra o elige un archivo">' +
      '<span class="big-ico">' + icon('<path d="M10 2 5 7l1.4 1.4L9 5.8V13h2V5.8l2.6 2.6L15 7l-5-5ZM3 15h14v3H3v-3Z"/>') + "</span>" +
      "<b>" + (replacing ? "Arrastra aquí la versión nueva" : "Arrastra aquí tu documento") + "</b>" +
      '<span class="muted">o <span style="color:var(--um-text-link);font-weight:600">elígelo de tu computador</span></span>' +
      '<span class="tertiary">PDF, JPG o PNG · hasta 10 MB</span></div>' +
      '<div class="mobile-pick"><button class="primary" type="button" data-cam>' + icon('<path d="M7.5 3 6 5H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2l-1.5-2h-5ZM10 7.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7Z"/>') + "Tomar foto</button>" +
      '<button class="secondary" type="button" data-pick>' + icon('<path d="M5 2h7l4 4v12H5V2Zm4 7v3H6v2h3v3h2v-3h3v-2h-3V9H9Z"/>') + "Elegir archivo</button></div>" +
      '<div class="field date-field"><label for="docDate">Fecha del documento <span class="tertiary">(opcional)</span></label><input class="input" type="date" id="docDate"' + (d.date ? ' value="' + d.date + '"' : "") + '><span class="help">La fecha de expedición o del periodo que cubre.</span></div>';
  }

  function renderDetail() {
    var d = byId(state.sel); if (!d) { detailEl.innerHTML = ""; return; }
    var s = STATUS[d.st], g = groups.filter(function (x) { return x.id === d.g; })[0];
    var body = "";
    var reqs = '<ul class="req">' +
      '<li>' + icon('<path d="M5 2h7l4 4v12H5V2Zm7 1.5V7h3.5L12 3.5Z"/>') + "PDF, JPG o PNG, de hasta 10 MB.</li>" +
      (d.validity ? '<li>' + icon('<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm1 4v5.4l3.3 2-1 1.7L9 11.5V5h2Z"/>') + esc(d.validity) + "</li>" : "") +
      (d.period ? '<li>' + icon('<path d="M6 2v2H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2V2h-2v2H8V2H6ZM5 8h10v8H5V8Z"/>') + "Periodo: " + esc(d.period) + ".</li>" : "") +
      '<li>' + icon('<path d="M10 2a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6Zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>') + "Si es una foto: buena luz, sin reflejos y que se lean todos los datos.</li></ul>";

    if (state.uploading === d.id) {
      body = '<div class="uploading" aria-live="polite"><b id="upName">Subiendo…</b><div class="bar"><i id="upBar"></i></div><p id="upText">Enviando el archivo</p></div>';
    } else if (d.st === "PENDING") {
      body = reqs + dropzone(d, false);
    } else if (d.st === "REJECTED") {
      body = '<div class="msg tone-danger">' + icon(STATUS.REJECTED.icon) + "<div><b>Tu asesora pidió corregirlo · " + esc(d.reason) + "</b><p>" + esc(d.msg) + "</p></div></div>" +
        fileCard(d, '<button class="btn btn-default btn-sm" type="button" data-open>Ver el que subiste</button>') + reqs + dropzone(d, true);
    } else if (d.st === "UPLOADED") {
      body = fileCard(d, '<button class="btn btn-default btn-sm" type="button" data-open>Ver</button><button class="btn btn-default btn-sm" type="button" data-replace>Reemplazar</button>') +
        '<div class="lock">' + icon('<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-1 4h2v2H9V5Zm0 4h2v6H9V9Z"/>') + "Puedes reemplazarlo mientras tu asesora no lo haya revisado. Si subes otro, ella revisará el más reciente.</div>" +
        '<div id="replaceZone" hidden>' + reqs + dropzone(d, true) + "</div>";
    } else if (d.st === "APPROVED") {
      body = fileCard(d, '<button class="btn btn-default btn-sm" type="button" data-open>Ver</button>') +
        '<div class="lock">' + icon('<path d="M6 8V6a4 4 0 1 1 8 0v2h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1h1Zm2 0h4V6a2 2 0 1 0-4 0v2Z"/>') + "Ya fue aprobado y no se puede cambiar. Si necesitas corregirlo, escríbele a tu asesora.</div>";
    } else {
      body = '<div class="msg tone-accent">' + icon(STATUS.WAIVED.icon) + "<div><b>No necesitas subir este documento</b><p>" + esc(d.waived) + "</p></div></div>";
    }
    if (d.v > 1 && state.uploading !== d.id) {
      body += '<details class="versions"><summary>Ver versiones anteriores (' + (d.v - 1) + ')</summary><ol><li><b>Versión ' + d.v + '</b><span>actual · ' + esc(d.file.name) + '</span></li><li>Versión ' + (d.v - 1) + '<span>reemplazada · 9 nov</span></li></ol></details>';
    }
    detailEl.innerHTML = '<header class="d-head"><button class="btn btn-ghost btn-icon d-back" type="button" data-back aria-label="Volver a la lista">' + icon('<path d="m12.6 4 1.4 1.4L9.4 10l4.6 4.6-1.4 1.4-6-6 6-6Z"/>') + "</button>" +
      '<div style="min-width:0"><h2 id="dTitle">' + esc(d.name) + '</h2><div class="who">' + esc(g.short) + "</div></div><span class=\"spacer\"></span><span class=\"badge tone-" + s.tone + '">' + s.label + "</span></header>" +
      '<div class="d-body">' + body + "</div>";
    bindDetail(d);
  }

  function validate(file) {
    if (TYPES.indexOf(file.type) < 0) return { title: "Ese tipo de archivo no se puede subir", message: "“" + file.name + "” no es PDF, JPG ni PNG. Si es un documento de Word, guárdalo como PDF." };
    if (file.size > MAX) return { title: "El archivo pesa más de 10 MB", message: "“" + file.name + "” pesa " + (file.size / 1048576).toFixed(1).replace(".", ",") + " MB. Si es una foto, tómala con menos resolución; si es PDF, compártelo comprimido." };
    return null;
  }
  function fmtSize(b) { return b >= 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; }

  function upload(d, file) {
    var err = file && validate(file);
    if (err) { UmToast.show({ tone: "danger", title: err.title, message: err.message }); return; }
    var name = file ? file.name : (d.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") + ".pdf");
    var replacing = !!d.file;
    state.uploading = d.id; renderDetail();
    document.getElementById("upName").textContent = name;
    var pct = 0, bar = document.getElementById("upBar"), txt = document.getElementById("upText");
    // Simulación: subida -> análisis antivirus -> cargado. Si el navegador está sin conexión, falla con opción de reintentar.
    var t = setInterval(function () {
      pct += 20; bar.style.width = Math.min(pct, 100) + "%";
      if (pct === 60 && !navigator.onLine) {
        clearInterval(t); state.uploading = null; renderDetail();
        UmToast.show({ tone: "danger", title: "No pudimos subir el documento", message: "Parece que no tienes conexión. Tu archivo no se guardó.", action: { label: "Reintentar", onClick: function () { upload(d, file); } } });
        return;
      }
      if (pct === 100) txt.textContent = "Revisando que el archivo sea seguro…";
      if (pct >= 140) {
        clearInterval(t);
        d.file = { name: name, size: file ? fmtSize(file.size) : "520 KB", kind: (file ? file.type : "application/pdf").indexOf("image") === 0 ? "image" : "pdf", pages: 1, when: "ahora", url: file ? URL.createObjectURL(file) : null };
        d.v = (d.v || 0) + 1; d.st = "UPLOADED"; state.uploading = null;
        counts(); renderList(); renderDetail();
        UmToast.show({ tone: "success", title: replacing ? "Documento reemplazado" : "Documento subido", message: d.name + ": tu asesora lo revisará pronto. Te avisamos si hay que corregir algo.", action: { label: "Ver", onClick: function () { UmViewer.open({ name: d.file.name, kind: d.file.kind, pages: 1, size: d.file.size, url: d.file.url }); } } });
      }
    }, 300);
  }

  var pickFor = null;
  function bindDetail(d) {
    detailEl.querySelectorAll("[data-open]").forEach(function (b) { b.addEventListener("click", function () { UmViewer.open({ name: d.file.name, kind: d.file.kind, pages: d.file.pages, size: d.file.size, url: d.file.url }, b); }); });
    var back = detailEl.querySelector("[data-back]"); if (back) back.addEventListener("click", function () { detailEl.classList.remove("open"); var it = listEl.querySelector('[data-id="' + d.id + '"]'); if (it) it.focus(); });
    var rep = detailEl.querySelector("[data-replace]"); if (rep) rep.addEventListener("click", function () { var z = document.getElementById("replaceZone"); z.hidden = !z.hidden; rep.textContent = z.hidden ? "Reemplazar" : "Cancelar reemplazo"; });
    var drop = document.getElementById("drop");
    if (drop) {
      var pick = function () { pickFor = d; document.getElementById("filePick").click(); };
      drop.addEventListener("click", pick);
      drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
      ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
      ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
      drop.addEventListener("drop", function (e) { var f = e.dataTransfer.files[0]; if (f) upload(d, f); });
    }
    var pk = detailEl.querySelector("[data-pick]"); if (pk) pk.addEventListener("click", function () { pickFor = d; document.getElementById("filePick").click(); });
    var cam = detailEl.querySelector("[data-cam]"); if (cam) cam.addEventListener("click", function () { pickFor = d; document.getElementById("camPick").click(); });
  }
  ["filePick", "camPick"].forEach(function (id) {
    var inp = document.getElementById(id);
    inp.addEventListener("change", function () { if (inp.files[0] && pickFor) upload(pickFor, inp.files[0]); inp.value = ""; });
  });

  listEl.addEventListener("click", function (e) {
    var b = e.target.closest(".item"); if (!b) return;
    state.sel = +b.dataset.id; renderList(); renderDetail();
    if (isMobile()) { detailEl.classList.add("open"); var bk = detailEl.querySelector("[data-back]"); if (bk) bk.focus(); }
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.filter = b.dataset.f;
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    renderList();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && detailEl.classList.contains("open") && !document.getElementById("viewer").classList.contains("open")) detailEl.classList.remove("open"); });

  counts(); renderList(); renderDetail();
})();
</script>
<script>
// Comportamiento compartido de las pantallas de referencia: tema y menú móvil.
(function () {
  // Tema: solo claro y oscuro. Claro por defecto; la elección se recuerda en este navegador.
  var btn = document.getElementById("themeToggle");
  var cur = "light";
  try { cur = localStorage.getItem("um-theme") === "dark" ? "dark" : "light"; } catch (e) {}
  var applyTheme = function (m) {
    document.documentElement.setAttribute("data-theme", m);
    if (btn) {
      btn.dataset.mode = m;
      var label = m === "dark" ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
      btn.setAttribute("aria-label", label);
      btn.title = label;
    }
  };
  applyTheme(cur);
  if (btn) btn.addEventListener("click", function () {
    cur = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("um-theme", cur); } catch (e) {}
    applyTheme(cur);
  });
  var side = document.querySelector(".side");
  var open = document.getElementById("menuToggle");
  var scrim = document.querySelector(".scrim");
  if (side && open && scrim) {
    var set = function (v) {
      side.classList.toggle("open", v);
      scrim.classList.toggle("show", v);
      open.setAttribute("aria-expanded", String(v));
      if (v) { var f = side.querySelector("a, button"); if (f) f.focus(); }
    };
    open.addEventListener("click", function () { set(!side.classList.contains("open")); });
    scrim.addEventListener("click", function () { set(false); });
    side.querySelectorAll(".close-menu").forEach(function (b) { b.addEventListener("click", function () { set(false); open.focus(); }); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && side.classList.contains("open")) { set(false); open.focus(); } });
  }
})();

// ---------- toasts ----------
// UmToast.show({ tone: "success" | "danger" | "warning" | "info", title, message, action: { label, onClick }, duration })
// Éxito e información se cierran solos (5 s); los errores se quedan hasta que el usuario los cierra.
// Se pausan al pasar el mouse o al enfocar. Máximo 3 visibles: el más antiguo se va primero.
(function () {
  var host = document.createElement("div");
  host.className = "toasts";
  host.setAttribute("aria-live", "polite");
  host.setAttribute("aria-relevant", "additions");
  document.body.appendChild(host);
  var icons = {
    success: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-1.2 13L4.5 9.7l1.4-1.4 2.9 2.9 5.3-5.3 1.4 1.4-6.7 6.7Z"/>',
    danger: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-1 4h2v6H9V5Zm0 8h2v2H9v-2Z"/>',
    warning: '<path d="M10 2 1 18h18L10 2Zm-1 6h2v5H9V8Zm0 6h2v2H9v-2Z"/>',
    info: '<path d="M10 1a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-1 4h2v2H9V5Zm0 4h2v6H9V9Z"/>'
  };
  function remove(t) { if (!t.isConnected || t.classList.contains("leaving")) return; t.classList.add("leaving"); setTimeout(function () { t.remove(); }, 180); }
  window.UmToast = {
    show: function (o) {
      var tone = o.tone || "info";
      var duration = o.duration != null ? o.duration : (tone === "danger" ? 0 : 5000);
      var t = document.createElement("div");
      t.className = "toast " + tone;
      t.setAttribute("role", tone === "danger" ? "alert" : "status");
      t.innerHTML = '<svg class="t-ico" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' + icons[tone] + "</svg>" +
        "<div><b></b>" + (o.message ? "<p></p>" : "") + (o.action ? '<div class="t-actions"><button class="btn btn-default btn-sm" type="button"></button></div>' : "") + "</div>" +
        '<button class="btn btn-ghost btn-icon btn-sm t-close" type="button" aria-label="Cerrar aviso"><svg viewBox="0 0 20 20" fill="currentColor"><path d="m5.4 4 4.6 4.6L14.6 4 16 5.4 11.4 10l4.6 4.6-1.4 1.4-4.6-4.6L5.4 16 4 14.6 8.6 10 4 5.4 5.4 4Z"/></svg></button>' +
        (duration ? '<span class="t-timer" style="animation: toast-timer ' + duration + 'ms linear forwards"></span>' : "");
      t.querySelector("b").textContent = o.title;
      if (o.message) t.querySelector("p").textContent = o.message;
      if (o.action) { var a = t.querySelector(".t-actions button"); a.textContent = o.action.label; a.addEventListener("click", function () { o.action.onClick && o.action.onClick(); remove(t); }); }
      t.querySelector(".t-close").addEventListener("click", function () { remove(t); });
      host.appendChild(t);
      while (host.children.length > 3) remove(host.firstElementChild);
      if (duration) {
        var left = duration, started = Date.now(), timer = setTimeout(function () { remove(t); }, left), bar = t.querySelector(".t-timer");
        var pause = function () { clearTimeout(timer); left -= Date.now() - started; if (bar) bar.style.animationPlayState = "paused"; };
        var resume = function () { started = Date.now(); timer = setTimeout(function () { remove(t); }, left); if (bar) bar.style.animationPlayState = "running"; };
        t.addEventListener("mouseenter", pause); t.addEventListener("mouseleave", resume);
        t.addEventListener("focusin", pause); t.addEventListener("focusout", resume);
      }
      return t;
    }
  };
})();

</script>
<script>
// Visor de documentos de referencia. En la app real el archivo llega por una URL prefirmada
// (GET .../download) y el PDF se dibuja con un visor como PDF.js; aquí se simulan las páginas.
(function () {
  var el = document.getElementById("viewer");
  if (!el) return;
  var stage = document.getElementById("viewerStage");
  var state = { zoom: 1, rot: 0, page: 1, pages: 1, kind: "pdf", url: null }, last = null;
  var BASE = 640;

  function fakePage(n, total) {
    var lines = "";
    for (var i = 0; i < 9; i++) lines += '<i style="width:' + (60 + ((i * 37 + n * 13) % 40)) + '%"></i>';
    return '<div class="vpage" data-page="' + n + '"><div class="vh"></div><div class="vrow"><div style="display:grid;gap:8px"><i></i><i style="width:70%"></i></div><div style="display:grid;gap:8px"><i></i><i style="width:55%"></i></div></div><div class="vbox"></div>' + lines + '<div class="vfoot"><span>Documento de ejemplo</span><span>Página ' + n + " de " + total + "</span></div></div>";
  }
  function render() {
    var w = Math.round(Math.min(BASE, window.innerWidth - 32) * state.zoom);
    var t = "rotate(" + state.rot + "deg)";
    if (state.url && state.kind === "pdf") {
      stage.innerHTML = '<object class="viewer-real" data="' + state.url + '" type="application/pdf" aria-label="Vista del PDF"><p style="color:#fff">Tu navegador no puede mostrar el PDF aquí. Usa descargar.</p></object>';
    } else if (state.url) {
      stage.innerHTML = '<img class="viewer-real-img" alt="Vista del documento" src="' + state.url + '" style="width:' + w + "px;transform:" + t + '">';
    } else if (state.kind === "image") {
      stage.innerHTML = '<div class="vphoto" style="width:' + w + "px;transform:" + t + '">' + fakePage(1, 1).replace('class="vpage"', 'class="vpage" style="width:54%"') + "</div>";
    } else {
      var html = "";
      for (var p = 1; p <= state.pages; p++) html += fakePage(p, state.pages).replace('class="vpage"', 'class="vpage" style="width:' + w + "px;transform:" + t + '"');
      stage.innerHTML = html;
    }
    document.getElementById("viewerZoom").textContent = Math.round(state.zoom * 100) + " %";
    document.getElementById("viewerPage").textContent = state.page + " / " + state.pages;
    el.querySelector("[data-vprev]").disabled = state.page <= 1;
    el.querySelector("[data-vnext]").disabled = state.page >= state.pages;
  }
  function goTo(n) {
    state.page = Math.max(1, Math.min(state.pages, n));
    var pg = stage.querySelector('[data-page="' + state.page + '"]');
    if (pg) pg.scrollIntoView({ block: "start", behavior: "smooth" });
    document.getElementById("viewerPage").textContent = state.page + " / " + state.pages;
    el.querySelector("[data-vprev]").disabled = state.page <= 1;
    el.querySelector("[data-vnext]").disabled = state.page >= state.pages;
  }
  window.UmViewer = {
    open: function (o, from) {
      state = { zoom: 1, rot: 0, page: 1, pages: o.pages || 1, kind: o.kind || "pdf", url: o.url || null };
      document.getElementById("viewerName").textContent = o.name;
      document.getElementById("viewerMeta").textContent = (state.kind === "image" ? "Imagen" : "PDF · " + state.pages + (state.pages === 1 ? " página" : " páginas")) + (o.size ? " · " + o.size : "");
      var dl = el.querySelector("[data-vdownload]");
      if (o.url) { dl.href = o.url; dl.setAttribute("download", o.name); } else { dl.href = "#"; dl.removeAttribute("download"); }
      document.getElementById("viewerNote").textContent = o.url ? "Vista local del archivo que elegiste. Todavía no se ha enviado." : "Descarga con enlace firmado que vence en 5 minutos.";
      last = from || document.activeElement;
      el.classList.add("open"); el.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden";
      render(); stage.scrollTop = 0; el.querySelector("[data-vclose]").focus();
    },
    close: function () { el.classList.remove("open"); el.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; if (last) last.focus(); }
  };
  el.querySelector("[data-vclose]").addEventListener("click", window.UmViewer.close);
  el.querySelector("[data-vprev]").addEventListener("click", function () { goTo(state.page - 1); });
  el.querySelector("[data-vnext]").addEventListener("click", function () { goTo(state.page + 1); });
  el.querySelectorAll("[data-vzoom]").forEach(function (b) { b.addEventListener("click", function () { state.zoom = Math.max(0.5, Math.min(2.5, state.zoom + 0.25 * +b.dataset.vzoom)); render(); }); });
  el.querySelector("[data-vfit]").addEventListener("click", function () { state.zoom = 1; render(); });
  el.querySelector("[data-vrotate]").addEventListener("click", function () { state.rot = (state.rot + 90) % 360; render(); });
  el.querySelector("[data-vdownload]").addEventListener("click", function (e) { if (this.getAttribute("href") === "#") e.preventDefault(); });
  stage.addEventListener("scroll", function () {
    var pages = stage.querySelectorAll("[data-page]"), top = stage.scrollTop + 80, cur = 1;
    pages.forEach(function (p) { if (p.offsetTop <= top) cur = +p.dataset.page; });
    if (cur !== state.page) { state.page = cur; document.getElementById("viewerPage").textContent = cur + " / " + state.pages; el.querySelector("[data-vprev]").disabled = cur <= 1; el.querySelector("[data-vnext]").disabled = cur >= state.pages; }
  });
  document.addEventListener("keydown", function (e) {
    if (!el.classList.contains("open")) return;
    if (e.key === "Escape") window.UmViewer.close();
    else if (e.key === "+" || e.key === "=") { state.zoom = Math.min(2.5, state.zoom + 0.25); render(); }
    else if (e.key === "-") { state.zoom = Math.max(0.5, state.zoom - 0.25); render(); }
    else if (e.key === "ArrowRight" || e.key === "PageDown") goTo(state.page + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") goTo(state.page - 1);
  });
  // Botones con data-view="nombre|pdf|páginas|tamaño" abren el visor.
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-view]"); if (!b) return;
    e.preventDefault();
    var p = b.dataset.view.split("|");
    window.UmViewer.open({ name: p[0], kind: p[1], pages: +p[2] || 1, size: p[3] }, b);
  });
})();

</script>
